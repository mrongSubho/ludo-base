<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="heat-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFDD00"/>
      <stop offset="40%" stop-color="#FF3300"/>
      <stop offset="85%" stop-color="#880000"/>
      <stop offset="100%" stop-color="#1a0000"/>
    </radialGradient>
  </defs>
  <!-- Pulsing Warning Aura -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="#FF2200" stroke-width="2" stroke-dasharray="6 4" opacity="0.8"/>
  <circle cx="64" cy="64" r="50" fill="url(#heat-core)" stroke="#FF8800" stroke-width="3"/>
  <!-- Steam vents -->
  <path d="M44 20 Q40 12 48 6" fill="none" stroke="#FFAA00" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <path d="M64 16 Q60 8 68 2" fill="none" stroke="#FF5500" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  <path d="M84 20 Q80 12 88 6" fill="none" stroke="#FFAA00" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <!-- Angry Eyes (slanting inward) -->
  <polygon points="40,50 56,58 42,62" fill="#FFFFFF"/>
  <polygon points="88,50 72,58 86,62" fill="#FFFFFF"/>
  <!-- Glowing Fiery Pupils -->
  <circle cx="48" cy="56" r="3" fill="#FFCC00"/>
  <circle cx="80" cy="56" r="3" fill="#FFCC00"/>
  <!-- Grimace Teeth Grille -->
  <rect x="46" y="76" width="36" height="10" rx="3" fill="#000000" stroke="#FFCC00" stroke-width="1.5"/>
  <line x1="55" y1="76" x2="55" y2="86" stroke="#FF5500" stroke-width="2"/>
  <line x1="64" y1="76" x2="64" y2="86" stroke="#FF5500" stroke-width="2"/>
  <line x1="73" y1="76" x2="73" y2="86" stroke="#FF5500" stroke-width="2"/>
  <!-- Temperature Indicator -->
  <rect x="34" y="98" width="60" height="14" rx="4" fill="#000" stroke="#FF2200" stroke-width="1.5"/>
  <text x="64" y="109" fill="#FF4400" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">OVERHEAT 99°C</text>
</svg>

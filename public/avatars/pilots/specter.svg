<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg-specter" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#0c2233"/>
      <stop offset="55%" stop-color="#08111b"/>
      <stop offset="100%" stop-color="#04070d"/>
    </radialGradient>
    <radialGradient id="aura-specter" cx="50%" cy="46%" r="44%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#04070d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cowl-specter" x1="20%" y1="5%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#273449"/>
      <stop offset="45%" stop-color="#141d2b"/>
      <stop offset="100%" stop-color="#070b12"/>
    </linearGradient>
    <linearGradient id="mask-specter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow-specter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" fill="url(#bg-specter)"/>
  <circle cx="128" cy="122" r="108" fill="url(#aura-specter)"/>
  <!-- Subtle sonar rings -->
  <circle cx="128" cy="124" r="88" fill="none" stroke="#38bdf8" stroke-opacity="0.14" stroke-width="1"/>
  <circle cx="128" cy="124" r="104" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Stealth cloak shoulders -->
  <path d="M28 256 C38 206 66 184 96 178 L128 192 L160 178 C190 184 218 206 228 256 Z" fill="url(#cowl-specter)" stroke="#334155" stroke-width="1.6"/>
  <path d="M58 256 L78 194 L128 226 L178 194 L198 256 Z" fill="#090e17" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1.2"/>

  <!-- Outer stealth hood silhouette -->
  <path d="M56 144 C56 78 86 42 128 40 C170 42 200 78 200 144 L188 188 L156 208 L128 214 L100 208 L68 188 Z" fill="url(#cowl-specter)" stroke="#475569" stroke-width="1.8"/>
  <!-- Hood rim lighting -->
  <path d="M62 138 C62 82 90 48 128 46 C166 48 194 82 194 138" fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>

  <!-- Recessed shadow cavity inside hood -->
  <path d="M74 128 C74 86 96 66 128 66 C160 66 182 86 182 128 L172 172 L148 194 L128 198 L108 194 L84 172 Z" fill="#05080f"/>

  <!-- Sculpted carbon skull-baffle recon faceplate -->
  <path d="M84 106 L128 82 L172 106 L168 152 L148 184 L128 192 L108 184 L88 152 Z" fill="url(#mask-specter)" stroke="#64748b" stroke-width="1.4"/>
  <!-- Forehead tactical stealth seam -->
  <path d="M128 84 L128 124" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="1.4"/>

  <!-- Quad-optic NVG glowing ice-cyan eyes (two primary + two micro rangefinders) -->
  <polygon points="90,118 118,124 114,135 92,131" fill="#040810"/>
  <polygon points="166,118 138,124 142,135 164,131" fill="#040810"/>
  <circle cx="105" cy="126" r="6" fill="#38bdf8" filter="url(#glow-specter)"/>
  <circle cx="105" cy="126" r="2.6" fill="#f0f9ff"/>
  <circle cx="151" cy="126" r="6" fill="#38bdf8" filter="url(#glow-specter)"/>
  <circle cx="151" cy="126" r="2.6" fill="#f0f9ff"/>
  <!-- Secondary micro optics -->
  <circle cx="91" cy="124" r="2.5" fill="#00e5ff" opacity="0.85"/>
  <circle cx="165" cy="124" r="2.5" fill="#00e5ff" opacity="0.85"/>

  <!-- Angular tactical breather grille -->
  <path d="M104 150 L128 142 L152 150 L146 182 L128 190 L110 182 Z" fill="#0b1220" stroke="#475569" stroke-width="1.2"/>
  <path d="M114 156 V178 M123 152 V182 M133 152 V182 M142 156 V178" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85" filter="url(#glow-specter)"/>
</svg>

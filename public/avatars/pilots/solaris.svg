<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg-solaris" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#2e1e09"/>
      <stop offset="55%" stop-color="#130f0b"/>
      <stop offset="100%" stop-color="#060910"/>
    </radialGradient>
    <radialGradient id="aura-solaris" cx="50%" cy="46%" r="44%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060910" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ceramic-solaris" x1="15%" y1="8%" x2="85%" y2="92%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="85%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="gold-visor-solaris" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="32%" stop-color="#f59e0b"/>
      <stop offset="68%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="gold-trim-solaris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="glow-solaris" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" fill="url(#bg-solaris)"/>
  <circle cx="128" cy="120" r="108" fill="url(#aura-solaris)"/>
  <circle cx="128" cy="124" r="96" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="14 8"/>

  <!-- Flight suit shoulders -->
  <path d="M32 256 C42 214 68 194 96 188 L128 200 L160 188 C188 194 214 214 224 256 Z" fill="url(#ceramic-solaris)" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M62 256 L80 202 L128 224 L176 202 L194 256 Z" fill="#111827" stroke="url(#gold-trim-solaris)" stroke-width="1.8"/>
  <path d="M98 190 L128 212 L158 190" fill="none" stroke="#fbbf24" stroke-width="2.5"/>

  <!-- Neck & flight collar -->
  <path d="M104 176 L152 176 L148 206 L128 216 L108 206 Z" fill="#0f172a"/>

  <!-- Aerodynamic interceptor helmet -->
  <path d="M66 122 C66 72 92 46 128 46 C164 46 190 72 190 122 L182 162 L156 186 L128 194 L100 186 L74 162 Z" fill="url(#ceramic-solaris)" stroke="#e2e8f0" stroke-width="1.6"/>
  <!-- Gold racing stripe over crown -->
  <path d="M118 47 L138 47 L134 86 L122 86 Z" fill="url(#gold-trim-solaris)"/>
  <!-- Carbon side panels -->
  <path d="M68 112 C70 84 84 64 102 54 L94 92 L72 114 Z" fill="#1e293b"/>
  <path d="M188 112 C186 84 172 64 154 54 L162 92 L184 114 Z" fill="#1e293b"/>

  <!-- Full wraparound mirrored gold sun-visor -->
  <path d="M74 104 C88 86 110 82 128 82 C146 82 168 86 182 104 L178 144 C164 156 146 162 128 162 C110 162 92 156 78 144 Z" fill="url(#gold-visor-solaris)" stroke="url(#gold-trim-solaris)" stroke-width="2.2"/>
  <!-- Crisp sunlit horizon specular reflection -->
  <path d="M84 106 C98 93 114 90 128 90 C142 90 156 93 168 104 C148 110 112 114 86 124 Z" fill="#fef9c3" opacity="0.58"/>
  <path d="M90 138 C110 148 146 148 166 138" fill="none" stroke="#fde68a" stroke-opacity="0.5" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Sculpted ceramic chin guard -->
  <path d="M84 150 L110 164 L146 164 L172 150 L164 178 L146 190 L128 194 L110 190 L92 178 Z" fill="url(#ceramic-solaris)" stroke="#94a3b8" stroke-width="1.3"/>
  <path d="M112 172 H144 L140 186 H116 Z" fill="#1e293b" stroke="url(#gold-trim-solaris)" stroke-width="1.2"/>

  <!-- Ear-comm pods with glowing cyan comms strips -->
  <rect x="59" y="106" width="12" height="38" rx="6" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.4"/>
  <rect x="185" y="106" width="12" height="38" rx="6" fill="#1e293b" stroke="#cbd5e1" stroke-width="1.4"/>
  <line x1="65" y1="115" x2="65" y2="135" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-solaris)"/>
  <line x1="191" y1="115" x2="191" y2="135" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" filter="url(#glow-solaris)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg-warden" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#2b170b"/>
      <stop offset="55%" stop-color="#130e0c"/>
      <stop offset="100%" stop-color="#06080e"/>
    </radialGradient>
    <radialGradient id="aura-warden" cx="50%" cy="48%" r="44%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#ea580c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#06080e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="forge-warden" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="40%" stop-color="#334155"/>
      <stop offset="80%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="amber-visor" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="45%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow-warden" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" fill="url(#bg-warden)"/>
  <circle cx="128" cy="122" r="108" fill="url(#aura-warden)"/>
  <!-- Shield chevron frame hints -->
  <path d="M52 192 L36 124 L52 56 M204 192 L220 124 L204 56" fill="none" stroke="#fb923c" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Heavy forged sentinel shoulders -->
  <path d="M24 256 L42 198 L90 182 L128 198 L166 182 L214 198 L232 256 Z" fill="url(#forge-warden)" stroke="#64748b" stroke-width="1.8"/>
  <path d="M54 256 L72 204 L128 228 L184 204 L202 256 Z" fill="#0d131f" stroke="#475569" stroke-width="1.4"/>
  <path d="M72 204 L128 228 L184 204" fill="none" stroke="#fb923c" stroke-width="2.2" filter="url(#glow-warden)"/>

  <!-- Neck armor -->
  <path d="M100 176 L156 176 L150 212 L128 222 L106 212 Z" fill="#0b1019"/>

  <!-- Paladin-mech helmet silhouette -->
  <path d="M68 106 L78 58 L128 42 L178 58 L188 106 L180 162 L152 190 L128 198 L104 190 L76 162 Z" fill="url(#forge-warden)" stroke="#94a3b8" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Forged crown crest -->
  <path d="M116 44 L128 32 L140 44 L136 98 L120 98 Z" fill="#475569" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="128" y1="38" x2="128" y2="94" stroke="#fb923c" stroke-width="2.2" stroke-linecap="round" filter="url(#glow-warden)"/>

  <!-- Armored cheek plates -->
  <path d="M72 118 L112 134 L112 184 L82 164 Z" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>
  <path d="M184 118 L144 134 L144 184 L174 164 Z" fill="#1e293b" stroke="#64748b" stroke-width="1.3"/>

  <!-- Iconic glowing molten-amber T-Visor -->
  <path d="M78 104 L178 104 L172 124 L138 128 L136 184 L120 184 L118 128 L84 124 Z" fill="#070a10" stroke="#475569" stroke-width="1.4"/>
  <path d="M84 109 L172 109 L167 120 L134 124 L132 178 L124 178 L122 124 L89 120 Z" fill="url(#amber-visor)" filter="url(#glow-warden)"/>
  <path d="M90 113 H166 M128 116 V172" stroke="#fff7ed" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

  <!-- Cheek vents -->
  <path d="M88 148 L104 154 M89 158 L104 164" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  <path d="M168 148 L152 154 M167 158 L152 164" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
</svg>

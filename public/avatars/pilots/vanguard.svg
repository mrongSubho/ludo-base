<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bg-vanguard" cx="50%" cy="44%" r="60%">
      <stop offset="0%" stop-color="#0b2820"/>
      <stop offset="55%" stop-color="#081414"/>
      <stop offset="100%" stop-color="#05090d"/>
    </radialGradient>
    <radialGradient id="aura-vanguard" cx="50%" cy="48%" r="44%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#059669" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#05090d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armor-vanguard" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#4b5a55"/>
      <stop offset="45%" stop-color="#273330"/>
      <stop offset="85%" stop-color="#141c1b"/>
      <stop offset="100%" stop-color="#0a0f10"/>
    </linearGradient>
    <linearGradient id="visor-vanguard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow-vanguard" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" fill="url(#bg-vanguard)"/>
  <circle cx="128" cy="122" r="108" fill="url(#aura-vanguard)"/>
  <!-- Heavy orbital HUD brackets -->
  <path d="M44 64 L44 46 L62 46 M212 64 L212 46 L194 46" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Heavy armored pauldrons -->
  <path d="M22 256 C30 206 58 186 92 182 L128 194 L164 182 C198 186 226 206 234 256 Z" fill="url(#armor-vanguard)" stroke="#475569" stroke-width="1.8"/>
  <path d="M48 256 L66 196 L104 206 L128 224 L152 206 L190 196 L208 256 Z" fill="#101819" stroke="#334155" stroke-width="1.4"/>
  <!-- Shoulder tactical lights -->
  <rect x="44" y="216" width="18" height="5" rx="2.5" fill="#10b981" filter="url(#glow-vanguard)"/>
  <rect x="194" y="216" width="18" height="5" rx="2.5" fill="#10b981" filter="url(#glow-vanguard)"/>

  <!-- Heavy neck seal -->
  <path d="M98 176 L158 176 L152 210 L128 220 L104 210 Z" fill="#0b1014"/>

  <!-- Tactical antenna on right temple -->
  <path d="M188 106 L196 46" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="196" cy="46" r="4" fill="#10b981" filter="url(#glow-vanguard)"/>

  <!-- Heavy angular drop-trooper helmet -->
  <path d="M64 114 C64 66 90 46 128 46 C166 46 192 66 192 114 L188 158 L164 184 L128 194 L92 184 L68 158 Z" fill="url(#armor-vanguard)" stroke="#64748b" stroke-width="1.8"/>
  <!-- Brow armor plate & ridge -->
  <path d="M74 96 L96 76 L160 76 L182 96 L168 106 L88 106 Z" fill="#334155" stroke="#64748b" stroke-width="1.2"/>
  <rect x="116" y="60" width="24" height="10" rx="3" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <circle cx="128" cy="65" r="2.2" fill="#34d399" filter="url(#glow-vanguard)"/>

  <!-- Panoramic emerald HUD visor -->
  <path d="M76 106 L180 106 L172 142 L144 152 L112 152 L84 142 Z" fill="#04110e" stroke="#475569" stroke-width="1.6"/>
  <path d="M82 111 L174 111 L167 138 L142 146 L114 146 L89 138 Z" fill="url(#visor-vanguard)" filter="url(#glow-vanguard)"/>
  <!-- Glass specular reflection & HUD telemetry lines -->
  <path d="M90 116 L132 116 L118 134 L94 134 Z" fill="#d1fae5" opacity="0.45"/>
  <path d="M142 122 H164 M148 129 H162" stroke="#ecfdf5" stroke-opacity="0.7" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Heavy respirator jaw & twin filter pods -->
  <path d="M84 146 L110 156 L146 156 L172 146 L166 178 L146 192 L110 192 L90 178 Z" fill="#1f2933" stroke="#64748b" stroke-width="1.4"/>
  <rect x="110" y="164" width="36" height="22" rx="6" fill="#0d1418" stroke="#475569" stroke-width="1.2"/>
  <path d="M118 171 H138 M118 178 H138" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <circle cx="94" cy="168" r="8" fill="#0f172a" stroke="#64748b" stroke-width="1.6"/>
  <circle cx="94" cy="168" r="3" fill="#10b981"/>
  <circle cx="162" cy="168" r="8" fill="#0f172a" stroke="#64748b" stroke-width="1.6"/>
  <circle cx="162" cy="168" r="3" fill="#10b981"/>
</svg>

# Ludo Base CHIPS contracts — prefer base-forge (B20-aware Foundry).
# Standard `forge` cannot simulate B20 precompile calls; use base-forge/base-anvil for those.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
ffi = false
verbosity = 2

# Fill after acquiring a BaseScan key (never commit secrets).
# [etherscan]
# base_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
# base = { key = "${ETHERSCAN_API_KEY}", url = "https://api.basescan.org/api" }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    # check:schema DB mode applies the real migration chain to a scratch
    # Postgres and asserts catalog invariants (grants, security definer
    # EXECUTE, column defaults, function signatures). Static A1-A4 run without
    # this service; the DB assertions need a real engine.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      LUDO_SCHEMA_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff-scoped UI guards (check:ui-tokens / check:ui-contract) need
          # history to compare against; a shallow clone would make them no-op.
          fetch-depth: 0
      # Node comes from .nvmrc, not a literal here: CI, local dev and the
      # `engines` field must not drift apart. Node 20 went EOL in April 2026 and
      # received none of the Oct-2026 security patches; it is also below
      # wrangler 4.x's own >=22 floor, so a build job on it would break.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      # foundry for scripts/deploy-guardrails.test.ts, which executes the real
      # deploy scripts and asserts they refuse dev keys. Without it those tests
      # could not reach the guard at all: foundry-deploy.sh dies at its own
      # `command -v forge` check first, so the tests were asserting on the wrong
      # error and CI reported failures that did not reproduce locally.
      - name: Install foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Foundry contract test suite
        run: forge test --root contracts
      - name: Engine unit tests
        run: npm test
      - name: Golden replay corpus (≥50 deterministic matches)
        run: npm run test:golden
      - name: Engine diff harness (core vs legacy, 1200 seeded matches)
        run: npm run test:engine-diff
      - name: Authority engine unit tests
        run: npm run test:engine-core
      - name: Netcode decision harness (dual-transport, retry, gates)
        run: npm run test:netcode
      - name: Protocol hostile-payload table (both transports)
        run: npm run test:protocol
      - name: Hooks harness (store sync, flush gate, effect pins)
        run: npm run test:hooks
      - name: Edge engine sync
        run: node scripts/check-edge-engine.mjs
      - name: RLS static gate
        run: npm run check:rls
      - name: Concurrency gate (parallel claim / bet / settle)
        # Real transactions on real connections: proves the unique-constraint
        # claim lock and the escrow's bounded debit under genuine contention.
        # Skips itself when LUDO_SCHEMA_DB_URL is unset.
        run: npm run test:concurrency
      - name: Route authorization matrix
        # Fails on any route missing from scripts/check-routes.mjs, any method
        # mismatch, any route claiming session auth without a guard, and any
        # newly-unauthenticated mutation.
        run: npm run check:routes
      - name: Motion gate (compositor-only + reduced-motion census)
        # CSS_LAYOUT_ANIMATION_PLAN §3.3: fails on NEW layout-property
        # animations (width/height/top/left/right/bottom/margin/padding in
        # CSS, inline styles, or framer-motion animate objects) outside the
        # documented KNOWN allowlist; reports the reduced-motion census.
        run: npm run check:motion
      - name: Image dimensions gate (no CLS-prone raw <img>)
        # CSS_LAYOUT_ANIMATION_PLAN §3.1 (G5): every raw <img> must carry
        # width/height attributes or style dims, so the browser reserves the
        # box before decode (CLS target ≤ 0.05 in-game). Closes the "static
        # gate (not yet built)" entry in plan §6.
        run: npm run check:img
      - name: Text-field contract gate (DESIGN.md §6.6)
        # Every free-text input/textarea must carry the "no OS interference"
        # set — autoComplete/autoCorrect/autoCapitalize/spellCheck — with the
        # three documented prose exceptions. Catches the class of bug where a
        # case-sensitive code field (invite code, wc: URI, referral) is
        # silently capitalised or autocorrected into a "not found".
        run: npm run check:fields
      - name: UI token guard (warn mode — dark-first utilities in the diff)
        # UI_DESIGN_AUDIT §6.3 / DESIGN.md §9. Diff-scoped so the legacy that is
        # still mid-migration does not block merges; flips to --strict when the
        # Phase 4 panel sweep completes. Requires full history for the diff.
        run: npm run check:ui-tokens || true
      - name: UI contract guard (warn mode — banned one-off values in the diff)
        # UI_COMPONENT_AUDIT E.1 / DESIGN.md §9: sub-10px text, arbitrary radii,
        # font-black outside chrome labels, pre-token accents, the retired
        # #0052FF fill. Same warn-mode policy as the token guard.
        run: npm run check:ui-contract || true
      - name: CSS budget baseline (advisory)
        # Plan §6: advisory until Phase 2 — prints the payload/surface numbers
        # the merge gates will enforce later; never blocks.
        run: npm run bench:css
      - name: Schema contract gate (static A1-A4 + DB-mode grants/defaults)
        # Static: catches the DB-01 class (CREATE OR REPLACE renaming input
        # parameters, silently truncating a non-transactional migration) and the
        # DB-02 class (a column default no code accepts).
        # DB mode (LUDO_SCHEMA_DB_URL set by the service above): applies the
        # chain for real and asserts column defaults, function signatures,
        # no anon/authenticated EXECUTE on security definer, and no anon table
        # grants beyond the allowlist.
        run: npm run check:schema

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Full project typecheck
        # Deno edge functions are excluded in tsconfig.json.
        # Fail on any TS error — ignoreBuildErrors is off in next.config.ts.
        run: npx tsc -p tsconfig.json --noEmit --pretty false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: ESLint (Next 16 removed `next lint`)
        run: npm run lint

  auth-gate:
    # Signing-storm regression gate: no ecrecover-only auth path may ship.
    # Every wallet-signature check must go through the 6492-aware shared
    # helper (Base 8453: EOA ecrecover + 1271/6492 validator), and the
    # session-guard reprompt policy must hold under deterministic replay.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: 6492 verification gate (static, no network)
        run: node scripts/verify-6492-gate.mjs
      - name: Session-guard reprompt policy (deterministic replay)
        run: npx --yes tsx scripts/session-guard-sim.ts

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    # check:schema DB mode applies the real migration chain to a scratch
    # Postgres and asserts catalog invariants (grants, security definer
    # EXECUTE, column defaults, function signatures). Static A1-A4 run without
    # this service; the DB assertions need a real engine.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      LUDO_SCHEMA_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Engine unit tests
        run: npm test
      - name: Golden replay corpus (≥50 deterministic matches)
        run: npm run test:golden
      - name: Edge engine sync
        run: node scripts/check-edge-engine.mjs
      - name: RLS static gate
        run: npm run check:rls
      - name: Schema contract gate (static A1-A4 + DB-mode grants/defaults)
        # Static: catches the DB-01 class (CREATE OR REPLACE renaming input
        # parameters, silently truncating a non-transactional migration) and the
        # DB-02 class (a column default no code accepts).
        # DB mode (LUDO_SCHEMA_DB_URL set by the service above): applies the
        # chain for real and asserts column defaults, function signatures,
        # no anon/authenticated EXECUTE on security definer, and no anon table
        # grants beyond the allowlist.
        run: npm run check:schema

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Full project typecheck
        # Deno edge functions are excluded in tsconfig.json.
        # Fail on any TS error — ignoreBuildErrors is off in next.config.ts.
        run: npx tsc -p tsconfig.json --noEmit --pretty false

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: ESLint (Next 16 removed `next lint`)
        run: npm run lint

  auth-gate:
    # Signing-storm regression gate: no ecrecover-only auth path may ship.
    # Every wallet-signature check must go through the 6492-aware shared
    # helper (Base 8453: EOA ecrecover + 1271/6492 validator), and the
    # session-guard reprompt policy must hold under deterministic replay.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: 6492 verification gate (static, no network)
        run: node scripts/verify-6492-gate.mjs
      - name: Session-guard reprompt policy (deterministic replay)
        run: npx --yes tsx scripts/session-guard-sim.ts
